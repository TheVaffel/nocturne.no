
<a class="header" class="main-title" href="/"><h1 class="main-title">{{ site.Title}}</h1></a>
<div style="display: flex; flex-direction: row; gap: 8px;">
  {{- range $item := .collection }}
  {{ $relURL := $item.section | relURL }}
  {{ with $.context.Site.GetPage $relURL }}
     <a class="navbar" href="{{ $item.section | relLangURL }}">
      <div >{{ $item.title }}
      </div>
     </a>
     {{ else }}
     <a class="navbar" href="/{{ $item.section }}"><div> {{ $item.title }}</div></a>
     {{end }}
  {{- end -}}
</div>
