<!DOCTYPE html>
<html lang="{{ $.Site.Language.Locale }}">
    {{- partial "head.html" . -}}
    <body a="{{ $.Site.Params.theme_config.appearance | default "auto" }}">
      <main class="page-content" aria-label="Content">

        <div class="off-settings">
          {{- partial "language-switcher.html" . -}}
        </div>

        <div class="w">
              {{ partial "navigation_header.html" (dict "context" $ "collection" hugo.Data.menu.topbar ) }}
                {{- block "main" . }}{{- end }}
                {{ partial "footer.html" }}
            </div>
        </main>
    </body>
</html>
